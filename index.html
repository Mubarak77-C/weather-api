<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Api</title>
    <script type="module" src="./src/script.js" defer></script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <h1>My Weather App</h1>

      <!-- Add search form -->
      <form id="search-form">
        <input
          type="text"
          id="city-input"
          placeholder="Enter city name..."
          required
        />
        <button type="submit" id="search-btn">Search</button>
      </form>

      <div id="weather-card">
        <h2 id="city-name">Search for a city...</h2>
        <!-- Add the weather icon image tag here -->
        <img id="weather-icon" src="" alt="" style="display: none" />
        <p id="temp"></p>
        <p id="desc"></p>
        <p id="humidity"></p>
      </div>
    </div>
  </body>
</html>
